name: Multi-Platform Proxy Monetizer

on:
  workflow_dispatch:
    inputs:
      gologin_proxies:
        description: 'GoLogin / Floppydata Proxies (one per line)'
        required: true
        type: string
        default: ''
      enable_proxyrack:
        description: 'Enable Proxyrack Peer (Auto-generates UUIDs for dashboard)'
        required: false
        type: boolean
        default: false
      packetstream_cid:
        description: 'PacketStream CID (Optional - leave empty to skip)'
        required: false
        type: string
        default: ''
      pawns_email:
        description: 'Pawns.app Email (Optional - leave empty to skip)'
        required: false
        type: string
        default: ''
      pawns_password:
        description: 'Pawns.app Password (Optional - leave empty to skip)'
        required: false
        type: string
        default: ''
      repocket_email:
        description: 'Repocket Email (Optional - leave empty to skip)'
        required: false
        type: string
        default: ''
      repocket_api_key:
        description: 'Repocket API Key (Optional - leave empty to skip)'
        required: false
        type: string
        default: ''
      bytelixir_token:
        description: 'ByteLixir Token (Optional - leave empty to skip)'
        required: false
        type: string
        default: ''

jobs:
  monetize-proxies:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # Run continuously up to GitHub's max runner time (~5.8 hours)

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || github.token }}
          fetch-depth: 0

      - name: Install System Utilities & Setup TUN Module
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq iptables iproute2 xxd
          sudo modprobe tun

      - name: Save Workflow Run State
        env:
          WORKFLOW_NAME: ${{ github.workflow }}
          PROXIES_INPUT: ${{ github.event.inputs.gologin_proxies }}
          ENABLE_PROXYRACK: ${{ github.event.inputs.enable_proxyrack }}
          PS_CID: ${{ github.event.inputs.packetstream_cid }}
          PAWNS_EMAIL: ${{ github.event.inputs.pawns_email }}
          REPOCKET_EMAIL: ${{ github.event.inputs.repocket_email }}
          BYTELIXIR_TOKEN: ${{ github.event.inputs.bytelixir_token }}
        run: |
          mkdir -p .state
          SAFE_WORKFLOW_NAME=$(echo "$WORKFLOW_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9_-]/_/g')
          STATE_FILE=".state/${SAFE_WORKFLOW_NAME}_last_run.json"

          cat <<EOF > "$STATE_FILE"
          {
            "workflow_name": "$WORKFLOW_NAME",
            "executed_at_utc": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "platforms": {
              "proxyrack": $ENABLE_PROXYRACK,
              "packetstream": $([ -n "$PS_CID" ] && echo "true" || echo "false"),
              "pawns_app": $([ -n "$PAWNS_EMAIL" ] && echo "true" || echo "false"),
              "repocket": $([ -n "$REPOCKET_EMAIL" ] && echo "true" || echo "false"),
              "bytelixir": $([ -n "$BYTELIXIR_TOKEN" ] && echo "true" || echo "false")
            },
            "raw_proxy_lines_count": $(echo "$PROXIES_INPUT" | grep -v '^[[:space:]]*$' | wc -l)
          }
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$STATE_FILE"
          git commit -m "chore: record state for ${WORKFLOW_NAME} [skip ci]" || echo "No changes to commit"
          git push origin main || git push origin HEAD || echo "State push completed or skipped"

      - name: Verify Proxies, Initialize Isolated Networks & Deploy Platforms
        env:
          PROXIES: ${{ github.event.inputs.gologin_proxies }}
          ENABLE_PROXYRACK: ${{ github.event.inputs.enable_proxyrack }}
          PS_CID: ${{ github.event.inputs.packetstream_cid }}
          PAWNS_EMAIL: ${{ github.event.inputs.pawns_email }}
          PAWNS_PASSWORD: ${{ github.event.inputs.pawns_password }}
          REPOCKET_EMAIL: ${{ github.event.inputs.repocket_email }}
          REPOCKET_API_KEY: ${{ github.event.inputs.repocket_api_key }}
          BYTELIXIR_TOKEN: ${{ github.event.inputs.bytelixir_token }}
        run: |
          echo "## 🚀 Active Proxy Nodes & Dashboard Registration" >> $GITHUB_STEP_SUMMARY
          echo "| Node Name | Country | External IP | Status | Proxyrack UUID |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY

          INDEX=0
          ACTIVE_NODES_COUNT=0

          while IFS= read -r raw_line || [ -n "$raw_line" ]; do
            line=$(echo "$raw_line" | xargs)
            [ -z "$line" ] && continue
            INDEX=$((INDEX + 1))

            echo ""
            echo "================================================================="
            echo " [CHECK] Testing Proxy Candidate #$INDEX..."
            echo "================================================================="

            # Strip protocol prefixes like 'geolocation://', 'http://', 'socks5://'
            STRIPPED=$(echo "$line" | sed -E 's|^[a-zA-Z0-9]+://||')

            if [[ "$STRIPPED" =~ ([^:@]+):([^@]+)@([^:]+):([0-9]+) ]]; then
              P_USER="${BASH_REMATCH[1]}"
              P_PASS="${BASH_REMATCH[2]}"
              P_HOST="${BASH_REMATCH[3]}"
              P_PORT="${BASH_REMATCH[4]}"
              PROXY_CURL_URL="http://${P_USER}:${P_PASS}@${P_HOST}:${P_PORT}"
            elif [[ "$STRIPPED" =~ ([^:]+):([0-9]+):([^:]+):([^:]+) ]]; then
              P_HOST="${BASH_REMATCH[1]}"
              P_PORT="${BASH_REMATCH[2]}"
              P_USER="${BASH_REMATCH[3]}"
              P_PASS="${BASH_REMATCH[4]}"
              PROXY_CURL_URL="http://${P_USER}:${P_PASS}@${P_HOST}:${P_PORT}"
            else
              echo "[SKIP] Unable to parse proxy line: $line"
              continue
            fi

            # 1. Pre-flight Check: Test connectivity & fetch Geo IP metadata
            GEO_RESPONSE=$(curl -x "$PROXY_CURL_URL" --connect-timeout 8 --max-time 15 -s http://ip-api.com/json/ || echo "{}")
            PROXY_STATUS=$(echo "$GEO_RESPONSE" | jq -r '.status // "fail"')

            if [ "$PROXY_STATUS" != "success" ]; then
              echo "❌ [DEAD PROXY] Proxy #$INDEX failed ping/connectivity test. Discarding."
              continue
            fi

            # 2. Extract Geo details
            NODE_IP=$(echo "$GEO_RESPONSE" | jq -r '.query')
            NODE_COUNTRY=$(echo "$GEO_RESPONSE" | jq -r '.country')
            NODE_COUNTRY_CODE=$(echo "$GEO_RESPONSE" | jq -r '.countryCode')
            NODE_CITY=$(echo "$GEO_RESPONSE" | jq -r '.city')
            
            SAFE_IP=$(echo "$NODE_IP" | tr '.' '_')
            NODE_NAME="${NODE_COUNTRY_CODE}_Node_${INDEX}_${SAFE_IP}"

            echo "✅ [ACTIVE PROXY]"
            echo "   • Node Identifier: $NODE_NAME"
            echo "   • Location:        $NODE_CITY, $NODE_COUNTRY ($NODE_COUNTRY_CODE)"
            echo "   • External IP:     $NODE_IP"

            # 3. Create isolated network namespace via transparent TUN container
            TUN_CONTAINER="tun_net_${NODE_NAME}"

            docker run -d \
              --name "$TUN_CONTAINER" \
              --cap-add=NET_ADMIN \
              --device /dev/net/tun \
              xjasonlyu/tun2socks:latest \
              -device tun0 \
              -proxy "$PROXY_CURL_URL"

            sleep 3

            # ----------------------------------------------------
            # 4. Deploy Platforms inside this Proxy's Network Namespace
            # ----------------------------------------------------
            PROXYRACK_UUID_DISPLAY="N/A"

            # [A] Proxyrack Peer
            if [ "$ENABLE_PROXYRACK" = "true" ]; then
              # Generate standard 64-character hexadecimal UUID required by Proxyrack
              PR_UUID=$(head -c 32 /dev/urandom | xxd -p | tr -d '\n')
              PROXYRACK_UUID_DISPLAY="$PR_UUID"

              docker run -d \
                --name "proxyrack_${NODE_NAME}" \
                --net=container:"$TUN_CONTAINER" \
                -e UUID="$PR_UUID" \
                -e DEVICE_NAME="$NODE_NAME" \
                proxyrack/pop:latest

              echo "  [+] Proxyrack started."
              echo "      >> DEVICE UUID: $PR_UUID"
              echo "      >> Add UUID at: https://peer.proxyrack.com/devices"
            fi

            # [B] PacketStream
            if [ -n "$PS_CID" ]; then
              docker run -d \
                --name "packetstream_${NODE_NAME}" \
                --net=container:"$TUN_CONTAINER" \
                -e CID="$PS_CID" \
                packetstream/psclient:latest
              echo "  [+] PacketStream started."
            fi

            # [C] Pawns.app (IPRoyal)
            if [ -n "$PAWNS_EMAIL" ] && [ -n "$PAWNS_PASSWORD" ]; then
              docker run -d \
                --name "pawns_${NODE_NAME}" \
                --net=container:"$TUN_CONTAINER" \
                iproyal/pawns-cli:latest \
                pawns-cli -email="$PAWNS_EMAIL" -password="$PAWNS_PASSWORD" -device-name="$NODE_NAME" -accept-tos
              echo "  [+] Pawns.app started."
            fi

            # [D] Repocket
            if [ -n "$REPOCKET_EMAIL" ] && [ -n "$REPOCKET_API_KEY" ]; then
              docker run -d \
                --name "repocket_${NODE_NAME}" \
                --net=container:"$TUN_CONTAINER" \
                -e RP_EMAIL="$REPOCKET_EMAIL" \
                -e RP_API_KEY="$REPOCKET_API_KEY" \
                repocket/repocket:latest
              echo "  [+] Repocket started."
            fi

            # [E] ByteLixir
            if [ -n "$BYTELIXIR_TOKEN" ]; then
              docker run -d \
                --name "bytelixir_${NODE_NAME}" \
                --net=container:"$TUN_CONTAINER" \
                -e BYTELIXIR_TOKEN="$BYTELIXIR_TOKEN" \
                bytelixir/bytelixir:latest
              echo "  [+] ByteLixir started."
            fi

            ACTIVE_NODES_COUNT=$((ACTIVE_NODES_COUNT + 1))
            echo "| \`$NODE_NAME\` | $NODE_COUNTRY ($NODE_COUNTRY_CODE) | \`$NODE_IP\` | 🟢 Running | \`$PROXYRACK_UUID_DISPLAY\` |" >> $GITHUB_STEP_SUMMARY

          done <<< "$PROXIES"

          echo ""
          echo "================================================================="
          echo "Deployment Completed: $ACTIVE_NODES_COUNT Active Node Stacks Online"
          echo "================================================================="

          if [ "$ACTIVE_NODES_COUNT" -eq 0 ]; then
            echo "[ERROR] No active proxies were found. Exiting."
            exit 1
          fi

          # Monitoring and health check loop
          for minute in $(seq 1 2 340); do
            echo "--------------------------------------------------------"
            echo "Heartbeat Check: Minute $minute / 340"
            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Image}}"
            sleep 120
          done
